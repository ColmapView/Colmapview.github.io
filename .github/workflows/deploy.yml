name: Deploy viewer hosts

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false
  # Wait in line. With the default single pending slot, a later push cancels a waiting tag deploy.
  queue: max

env:
  NODE_VERSION: '22'

jobs:
  validate:
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Enabled but incomplete custom releases fail before either upload.
      CLOUDFLARE_PAGES_ENABLED: ${{ vars.CLOUDFLARE_PAGES_ENABLED }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      CUSTOM_GOOGLE_DRIVE_API_KEY: ${{ secrets.CUSTOM_GOOGLE_DRIVE_API_KEY }}
      CUSTOM_GOOGLE_DRIVE_CLIENT_ID: ${{ vars.CUSTOM_GOOGLE_DRIVE_CLIENT_ID }}
      CUSTOM_GOOGLE_DRIVE_APP_ID: ${{ vars.CUSTOM_GOOGLE_DRIVE_APP_ID }}
      CUSTOM_HF_AUTH_ENABLED: ${{ vars.CUSTOM_HF_AUTH_ENABLED }}
      CUSTOM_HF_PUBLISH_ENABLED: ${{ vars.CUSTOM_HF_PUBLISH_ENABLED }}
      CUSTOM_HF_OAUTH_CLIENT_ID: ${{ vars.CUSTOM_HF_OAUTH_CLIENT_ID }}
      CUSTOM_HF_OAUTH_REDIRECT_URI: ${{ vars.CUSTOM_HF_OAUTH_REDIRECT_URI }}
      # GitHub Pages HF: release tags read HF_* (stable /latest/ callback); branch runs read HF_DEV_* (/dev/ callback).
      # Each side is guarded by ref_type, so an unset value becomes '' instead of borrowing the other channel's.
      # Custom builds replace all VITE_HF_* with CUSTOM_HF_*, and isolated previews clear them (profiles.mjs).
      VITE_HF_PUBLISH_ENABLED: ${{ github.ref_type == 'tag' && vars.HF_PUBLISH_ENABLED == 'true' || github.ref_type != 'tag' && vars.HF_DEV_PUBLISH_ENABLED == 'true' }}
      VITE_HF_AUTH_ENABLED: ${{ github.ref_type == 'tag' && vars.HF_AUTH_ENABLED == 'true' || github.ref_type != 'tag' && vars.HF_DEV_AUTH_ENABLED == 'true' }}
      VITE_HF_OAUTH_CLIENT_ID: ${{ github.ref_type == 'tag' && vars.HF_OAUTH_CLIENT_ID || github.ref_type != 'tag' && vars.HF_DEV_OAUTH_CLIENT_ID || '' }}
      VITE_HF_OAUTH_REDIRECT_URI: ${{ github.ref_type == 'tag' && vars.HF_OAUTH_REDIRECT_URI || github.ref_type != 'tag' && vars.HF_DEV_OAUTH_REDIRECT_URI || '' }}
      DEPLOYMENT_SHA: ${{ github.sha }}
      DEPLOYMENT_RELEASE: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          # This job holds the deploy token. Untrusted preview code can write default-branch cache entries,
          # and a restored archive can replace files outside ~/.npm, so restore no cache here.
          package-manager-cache: false
      - run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Preflight deployment configuration
        id: config
        run: node scripts/deployment/preflight.mjs
        env:
          CLOUDFLARE_API_TOKEN_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      - name: Determine deployment target
        id: target
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.-]+)?$ ]] || { echo 'Invalid release tag'; exit 1; }
            echo 'is_release=true' >> "$GITHUB_OUTPUT"
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "base_path=/$GITHUB_REF_NAME/" >> "$GITHUB_OUTPUT"
          else
            echo 'is_release=false' >> "$GITHUB_OUTPUT"
            echo 'version=dev' >> "$GITHUB_OUTPUT"
            echo 'base_path=/dev/' >> "$GITHUB_OUTPUT"
          fi
      - name: Build version or dev
        run: node scripts/deployment/build-profile.mjs github --skip-typecheck --base="$BUILD_BASE" --out=.tmp/deployment/version
        env:
          BUILD_BASE: ${{ steps.target.outputs.base_path }}
      - name: Build latest
        if: steps.target.outputs.is_release == 'true'
        run: node scripts/deployment/build-profile.mjs github --skip-typecheck --base=/latest/ --out=.tmp/deployment/github
      - name: Build custom production
        if: steps.config.outputs.custom_enabled == 'true'
        run: node scripts/deployment/build-profile.mjs custom --skip-typecheck --out=.tmp/deployment/custom
      - name: Create root redirect
        if: steps.target.outputs.is_release == 'true'
        run: node scripts/deployment/build-github-root.mjs
      - name: Download verified public Hub frontend
        if: steps.target.outputs.is_release == 'true'
        uses: actions/download-artifact@v6
        with:
          name: public-hub-pages
          path: .tmp/deployment/hub
      - name: Merge verified public Hub frontend into root
        if: steps.target.outputs.is_release == 'true'
        run: node scripts/deployment/hub-site.mjs --verify --merge-root=.tmp/deployment/root
      - name: Prepare archived pages without Google analytics or font requests
        if: steps.target.outputs.is_release == 'true'
        run: node scripts/deployment/prepare-archived-pages.mjs
      - name: Smoke prepared artifacts
        run: npm run test:deployment:browser
        env:
          DEPLOYMENT_SMOKE_ROOT: .tmp/deployment
          DEPLOYMENT_SMOKE_PROFILES: ${{ steps.config.outputs.custom_enabled == 'true' && 'version,github,custom' || steps.target.outputs.is_release == 'true' && 'version,github' || 'version' }}
      # Both builds and offline checks pass before the first external mutation.
      - name: Deploy to version directory
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.tmp/deployment/version
          destination_dir: ${{ steps.target.outputs.version }}
          keep_files: true
          commit_message: Deploy ${{ steps.target.outputs.version }}
      - name: Deploy to latest
        if: steps.target.outputs.is_release == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.tmp/deployment/github
          destination_dir: latest
          keep_files: true
          commit_message: Update latest to ${{ steps.target.outputs.version }}
      - name: Deploy root
        if: steps.target.outputs.is_release == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.tmp/deployment/root
          keep_files: true
          commit_message: Update root redirect
      - name: Deploy custom production
        if: steps.config.outputs.custom_enabled == 'true'
        # Project production branch is main; only tag runs can reach this step.
        run: npx --yes wrangler@4.147.0 pages deploy .tmp/deployment/custom --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main --commit-hash "$DEPLOYMENT_SHA" --commit-message "$DEPLOYMENT_RELEASE" --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Fresh job-local cache: never run a restored ~/.npm (_npx install or registry metadata) with the token.
          npm_config_cache: ${{ runner.temp }}/wrangler-npm-cache
      - name: Check live GitHub artifact
        run: node scripts/deployment/check-live.mjs "$LIVE_BASE" github --manifest="$EXPECTED_MANIFEST"
        env:
          LIVE_BASE: ${{ steps.target.outputs.is_release == 'true' && 'https://colmapview.github.io/latest/' || 'https://colmapview.github.io/dev/' }}
          EXPECTED_MANIFEST: ${{ steps.target.outputs.is_release == 'true' && '.tmp/deployment/github/deployment.json' || '.tmp/deployment/version/deployment.json' }}
      - name: Check live custom artifact
        if: steps.config.outputs.custom_enabled == 'true'
        run: node scripts/deployment/check-live.mjs https://colmapview.opsiclear.com/ custom --manifest=.tmp/deployment/custom/deployment.json
      - name: Check live Hub artifact
        if: steps.target.outputs.is_release == 'true'
        run: node scripts/deployment/hub-site.mjs --verify --live
      - name: Record successful deployment
        run: |
          if [[ "$CUSTOM_ENABLED" == "true" ]]; then
            echo "Dual-host release $DEPLOYMENT_RELEASE verified at source SHA $DEPLOYMENT_SHA." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GitHub Pages artifact verified at source SHA $DEPLOYMENT_SHA. Custom hosting was not deployed by this run." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          CUSTOM_ENABLED: ${{ steps.config.outputs.custom_enabled }}
      - name: Upload artifact smoke report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deployment-smoke-report
          path: |
            .tmp/deployment-smoke/report/
            .tmp/deployment-smoke/results/
          if-no-files-found: ignore
          retention-days: 7
